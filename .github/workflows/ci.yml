name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore ParkingSystem.sln

      - name: Build
        run: dotnet build ParkingSystem.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ParkingSystem.sln --configuration Release --no-build --verbosity normal
